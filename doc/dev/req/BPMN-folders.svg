<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Start Event -->
  <circle cx="50" cy="100" r="20" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="50" cy="100" r="17" fill="none" stroke="#000" stroke-width="2"/>
  <text x="50" y="140" text-anchor="middle" font-size="12">Start</text>
  
  <!-- Task: Get Missing Paths -->
  <rect x="120" y="70" width="140" height="60" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="190" y="95" text-anchor="middle" font-size="12" font-weight="bold">Get Missing</text>
  <text x="190" y="110" text-anchor="middle" font-size="12" font-weight="bold">Paths</text>
  
  <!-- Data: Paths -->
  <path d="M 310 70 L 340 70 L 350 85 L 350 130 L 310 130 Z M 340 70 L 340 85 L 350 85" fill="#f1f3f4" stroke="#666" stroke-width="1.5"/>
  <text x="330" y="105" text-anchor="middle" font-size="11">Paths[]</text>
  
  <!-- Task: Sort by Depth -->
  <rect x="410" y="70" width="140" height="60" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="480" y="95" text-anchor="middle" font-size="12" font-weight="bold">Sort Paths</text>
  <text x="480" y="110" text-anchor="middle" font-size="12" font-weight="bold">by Depth</text>
  
  <!-- Gateway: For Each Path -->
  <path d="M 620 100 L 660 60 L 700 100 L 660 140 Z" fill="#fff3cd" stroke="#856404" stroke-width="2"/>
  <text x="660" y="105" text-anchor="middle" font-size="14" font-weight="bold">∀</text>
  <text x="660" y="165" text-anchor="middle" font-size="11">For Each</text>
  
  <!-- Task: Split Path -->
  <rect x="590" y="220" width="140" height="60" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="660" y="245" text-anchor="middle" font-size="12" font-weight="bold">Split Path</text>
  <text x="660" y="260" text-anchor="middle" font-size="12" font-weight="bold">into Segments</text>
  
  <!-- Gateway: For Each Segment -->
  <path d="M 620 340 L 660 300 L 700 340 L 660 380 Z" fill="#fff3cd" stroke="#856404" stroke-width="2"/>
  <text x="660" y="345" text-anchor="middle" font-size="14" font-weight="bold">∀</text>
  <text x="660" y="405" text-anchor="middle" font-size="11">For Each</text>
  
  <!-- Gateway: Exists? -->
  <path d="M 420 340 L 460 300 L 500 340 L 460 380 Z" fill="#fff3cd" stroke="#856404" stroke-width="2"/>
  <text x="460" y="345" text-anchor="middle" font-size="14" font-weight="bold">?</text>
  <text x="460" y="405" text-anchor="middle" font-size="11">Exists?</text>
  
  <!-- Task: Create Folder -->
  <rect x="250" y="310" width="140" height="60" rx="5" fill="#e6f4ea" stroke="#137333" stroke-width="2"/>
  <text x="320" y="335" text-anchor="middle" font-size="12" font-weight="bold">Create Folder</text>
  <text x="320" y="350" text-anchor="middle" font-size="10">[API Call]</text>
  
  <!-- Task: Send Progress -->
  <rect x="590" y="440" width="140" height="50" rx="5" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="660" y="465" text-anchor="middle" font-size="12" font-weight="bold">Send Progress</text>
  <text x="660" y="480" text-anchor="middle" font-size="10">[Port Message]</text>
  
  <!-- End Event -->
  <circle cx="820" cy="100" r="20" fill="none" stroke="#000" stroke-width="4"/>
  <text x="820" y="140" text-anchor="middle" font-size="12">End</text>
  
  <!-- Flows -->
  <path d="M 70 100 L 120 100" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M 260 100 L 310 100" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M 350 100 L 410 100" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M 550 100 L 620 100" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M 660 140 L 660 220" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M 660 280 L 660 300" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M 620 340 L 500 340" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M 460 300 L 460 220 L 320 220 L 320 310" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="465" y="260" font-size="11">No</text>
  <path d="M 420 340 L 320 340 L 320 370" stroke="#000" stroke-width="2"/>
  <text x="370" y="335" font-size="11">Yes</text>
  <path d="M 320 370 L 540 370 L 540 340 L 620 340" stroke="#000" stroke-width="2"/>
  <path d="M 660 380 L 660 440" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M 730 465 L 780 465 L 780 100 L 800 100" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="750" y="450" font-size="11">Loop</text>
  <path d="M 700 100 L 800 100" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="750" y="95" font-size="11">Done</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000"/>
    </marker>
  </defs>
</svg>
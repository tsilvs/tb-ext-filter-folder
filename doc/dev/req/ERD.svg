<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Account -->
  <rect x="50" y="50" width="150" height="100" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="125" y="85" text-anchor="middle" font-weight="bold">Account</text>
  <text x="125" y="105" text-anchor="middle" font-size="12">- id: string</text>
  <text x="125" y="120" text-anchor="middle" font-size="12">- type: "imap"</text>
  <text x="125" y="135" text-anchor="middle" font-size="12">- identities[]</text>
  
  <!-- Folder -->
  <rect x="300" y="50" width="150" height="120" fill="#e6f4ea" stroke="#137333" stroke-width="2"/>
  <text x="375" y="85" text-anchor="middle" font-weight="bold">Folder</text>
  <text x="375" y="105" text-anchor="middle" font-size="12">- id: string</text>
  <text x="375" y="120" text-anchor="middle" font-size="12">- path: string</text>
  <text x="375" y="135" text-anchor="middle" font-size="12">- cleanPath: string</text>
  <text x="375" y="150" text-anchor="middle" font-size="12">- depth: number</text>
  <text x="375" y="165" text-anchor="middle" font-size="12">- type?: string</text>
  
  <!-- Message -->
  <rect x="550" y="50" width="150" height="100" fill="#fff3cd" stroke="#856404" stroke-width="2"/>
  <text x="625" y="85" text-anchor="middle" font-weight="bold">Message</text>
  <text x="625" y="105" text-anchor="middle" font-size="12">- id: string</text>
  <text x="625" y="120" text-anchor="middle" font-size="12">- author: string</text>
  <text x="625" y="135" text-anchor="middle" font-size="12">- folder: FolderId</text>
  
  <!-- Rule -->
  <rect x="300" y="250" width="150" height="140" fill="#fce8e6" stroke="#c5221f" stroke-width="2"/>
  <text x="375" y="285" text-anchor="middle" font-weight="bold">FilterRule</text>
  <text x="375" y="305" text-anchor="middle" font-size="12">- path: string</text>
  <text x="375" y="320" text-anchor="middle" font-size="12">- emails: string[]</text>
  <text x="375" y="335" text-anchor="middle" font-size="12">- uri: string</text>
  <text x="375" y="350" text-anchor="middle" font-size="12">- enabled: boolean</text>
  <text x="375" y="365" text-anchor="middle" font-size="12">- type: number</text>
  <text x="375" y="380" text-anchor="middle" font-size="12">- action: string</text>
  
  <!-- Config -->
  <rect x="50" y="250" width="150" height="140" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
  <text x="125" y="285" text-anchor="middle" font-weight="bold">Config</text>
  <text x="125" y="305" text-anchor="middle" font-size="12">- mergeCase: bool</text>
  <text x="125" y="320" text-anchor="middle" font-size="12">- scanLimit: number</text>
  <text x="125" y="335" text-anchor="middle" font-size="12">- defaultRoot: string</text>
  <text x="125" y="350" text-anchor="middle" font-size="12">- folderRoot: string</text>
  <text x="125" y="365" text-anchor="middle" font-size="12">- filters: Filter[]</text>
  <text x="125" y="380" text-anchor="middle" font-size="12">- accountPrefs: Map</text>
  
  <!-- Analysis -->
  <rect x="550" y="250" width="150" height="140" fill="#e8f0fe" stroke="#1967d2" stroke-width="2"/>
  <text x="625" y="285" text-anchor="middle" font-weight="bold">Analysis</text>
  <text x="625" y="305" text-anchor="middle" font-size="12">- missing: string[]</text>
  <text x="625" y="320" text-anchor="middle" font-size="12">- missingInbox: str[]</text>
  <text x="625" y="335" text-anchor="middle" font-size="12">- missingLeaf: obj[]</text>
  <text x="625" y="350" text-anchor="middle" font-size="12">- mismatched: obj[]</text>
  <text x="625" y="365" text-anchor="middle" font-size="12">- emptyFolders: str[]</text>
  <text x="625" y="380" text-anchor="middle" font-size="12">- invalidRules: obj[]</text>
  
  <!-- Relationships -->
  <path d="M 200 100 L 300 100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="250" y="95" font-size="11">has many</text>
  
  <path d="M 450 100 L 550 100" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="500" y="95" font-size="11">contains</text>
  
  <path d="M 375 170 L 375 250" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="380" y="215" font-size="11">targets</text>
  
  <path d="M 200 320 L 300 320" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="250" y="315" font-size="11">configures</text>
  
  <path d="M 450 320 L 550 320" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="500" y="315" font-size="11">produces</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>